# Buduje stronę (Vite) i publikuje ją na GitHub Pages przy każdym pushu na main.
# Pages włącza się samo (enablement: true); jeśli repo nazywa się <user>.github.io, strona jest pod https://<user>.github.io/,
# w innym repo pod https://<user>.github.io/<repo>/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *" # codziennie: świeże ceny z Trade Marketu (jeśli jest sekret WYNNVENTORY_KEY)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Klucz WynnVentory (Settings › Secrets and variables › Actions › WYNNVENTORY_KEY); bez niego strona działa bez cen.
      WYNNVENTORY_KEY: ${{ secrets.WYNNVENTORY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Trade Market prices (WynnVentory)
        if: ${{ env.WYNNVENTORY_KEY != '' }}
        run: npm run update-prices
        continue-on-error: true
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
